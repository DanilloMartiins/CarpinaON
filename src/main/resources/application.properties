# Configurações do CarpinaON API

# Porta da aplicação
# No Render a porta vem da variável PORT (dinâmica); local usa 8080
server.port=${PORT:8080}

# Configurações do Jackson (JSON)
spring.jackson.serialization.write-dates-as-timestamps=false

# Configurações JWT
jwt.secret=${JWT_SECRET:carpinaon-secret-key-muito-segura-2026-dev}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Configurações do Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Upload de anexos (multipart)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Cloudflare R2 (Object Storage dos anexos) - compatível com API do S3
r2.endpoint=${R2_ENDPOINT:}
r2.access-key-id=${R2_ACCESS_KEY_ID:}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
r2.bucket-name=${R2_BUCKET:}

# Google Places API (buscar Place ID pelo endereço)
google.places.api-key=${GOOGLE_PLACES_API_KEY:}
google.places.base-url=https://maps.googleapis.com/maps/api/place