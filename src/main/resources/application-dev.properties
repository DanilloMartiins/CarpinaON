# Profile de DESENVOLVIMENTO (local)
# Banco: Docker local (carpinaon-db) ou PostgreSQL instalado na porta 5432
# Ativar com: --spring.profiles.active=dev ou SPRING_PROFILES_ACTIVE=dev

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/carpinaon}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:CarpinaON@2026!}

# ddl-auto=update cria/ajusta as tabelas automaticamente em dev
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true