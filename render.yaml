# Render Blueprint - Plano B provisório (backend)
# Enquanto o Oracle Cloud está bloqueado, o app roda aqui pra validar com o Flutter.
# Quando o Oracle subir, esse arquivo deixa de existir.

services:
  - type: web
    name: carpinaon-api
    runtime: docker
    repo: https://github.com/DanilloMartiins/CarpinaON
    branch: master
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    plan: free
    envVars:
      # Neon (Postgres serverless). Banco: neondb
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://ep-polished-unit-afua843w.c-2.us-west-2.aws.neon.tech:5432/neondb?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        value: neondb_owner

      # Segredos: preencher no dashboard do Render (não vai pro repo)
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false

      # Cloudflare R2 (Object Storage dos anexos)
      - key: R2_ENDPOINT
        value: https://ac9a4c6d9d1208f981ed743c2382dbaf.r2.cloudflarestorage.com
      - key: R2_BUCKET
        value: carpinaon-anexos
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false

      # Pool pequeno pro Neon free não estourar conexões
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "10"
      - key: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
        value: "2"
      - key: SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT
        value: "30000"

      # Sem Flyway ainda: o JPA cria o schema
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update

      # JVM leve pro Render free (0.1 CPU, 512MB): startup rápido, heap controlado
      - key: JAVA_TOOL_OPTIONS
        value: -Xms256m -Xmx384m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Djava.security.egd=file:/dev/./urandom

      # Logs em produção
      - key: LOGGING_LEVEL_ROOT
        value: INFO
      - key: LOGGING_LEVEL_COM_CARPINAON
        value: INFO