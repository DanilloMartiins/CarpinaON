# Configurações do CarpinaON API

# Porta da aplicação
server.port=8080

# Configurações do banco PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/carpinaon
spring.datasource.username=postgres
spring.datasource.password=CarpinaON@2026!

# Configurações do JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configurações do Jackson (JSON)
spring.jackson.serialization.write-dates-as-timestamps=false

# Configurações JWT
jwt.secret=carpinaon-secret-key-muito-segura-2026-dev
jwt.expiration=86400000
