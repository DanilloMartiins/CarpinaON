# docker-compose DEV LOCAL - tudo numa máquina só pra testar antes das VMs
# Na produção em 2 VMs, use os composes embutidos nos cloud-inits:
#   VM1 = app + valkey   |   VM2 = db
#
# Uso: copie o .env.example pra .env, preencha as senhas e rode:
#   docker compose up -d

services:
  db:
    image: postgres:16-alpine
    container_name: carpinaon-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=carpinaon
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=carpinaon
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carpinaon -d carpinaon"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - carpinaon-network

  valkey:
    image: valkey/valkey:8-alpine
    container_name: carpinaon-valkey
    restart: unless-stopped
    command: >
      valkey-server
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - carpinaon-network

  app:
    build: .
    container_name: carpinaon-app
    restart: unless-stopped
    depends_on:
      - db
      - valkey
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/carpinaon
      - SPRING_DATASOURCE_USERNAME=carpinaon
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}

      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_PROPERTIES_HIBERNATE_JDBC_BATCH_SIZE=20
      - SPRING_JPA_PROPERTIES_HIBERNATE_ORDER_INSERTS=true
      - SPRING_JPA_PROPERTIES_HIBERNATE_ORDER_UPDATES=true

      - SPRING_DATA_REDIS_HOST=valkey
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_CACHE_TYPE=redis
      - SPRING_CACHE_REDIS_TIME_TO_LIVE=600000

      - JWT_SECRET=${JWT_SECRET}

      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,metrics,prometheus
      - MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS=always
      - MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED=true
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - carpinaon-network

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: carpinaon-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    networks:
      - carpinaon-network

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: carpinaon-alertmanager
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - carpinaon-network

  grafana:
    image: grafana/grafana:11.1.0
    container_name: carpinaon-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - carpinaon-network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: carpinaon-postgres-exporter
    restart: unless-stopped
    depends_on:
      - db
    environment:
      - DATA_SOURCE_NAME=postgresql://carpinaon:${DB_PASSWORD}@db:5432/carpinaon?sslmode=disable
    ports:
      - "9187:9187"
    networks:
      - carpinaon-network

volumes:
  pgdata:
    driver: local
  valkey-data:
    driver: local
  prometheus-data:
    driver: local
  alertmanager-data:
    driver: local
  grafana-data:
    driver: local

networks:
  carpinaon-network:
    driver: bridge