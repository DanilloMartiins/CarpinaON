# docker-compose DEV LOCAL - tudo numa máquina só pra testar antes das VMs
# Na produção em 2 VMs, use os composes embutidos nos cloud-inits:
#   VM1 = app + valkey   |   VM2 = db
#
# Uso: copie o .env.example pra .env, preencha as senhas e rode:
#   docker compose up -d

services:
  db:
    image: postgres:16-alpine
    container_name: carpinaon-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=carpinaon
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=carpinaon
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carpinaon -d carpinaon"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - carpinaon-network

  valkey:
    image: valkey/valkey:8-alpine
    container_name: carpinaon-valkey
    restart: unless-stopped
    command: >
      valkey-server
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - carpinaon-network

  app:
    build: .
    container_name: carpinaon-app
    restart: unless-stopped
    depends_on:
      - db
      - valkey
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/carpinaon
      - SPRING_DATASOURCE_USERNAME=carpinaon
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}

      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_PROPERTIES_HIBERNATE_JDBC_BATCH_SIZE=20
      - SPRING_JPA_PROPERTIES_HIBERNATE_ORDER_INSERTS=true
      - SPRING_JPA_PROPERTIES_HIBERNATE_ORDER_UPDATES=true

      - SPRING_DATA_REDIS_HOST=valkey
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_CACHE_TYPE=redis
      - SPRING_CACHE_REDIS_TIME_TO_LIVE=600000

      - JWT_SECRET=${JWT_SECRET}

      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,metrics,prometheus
      - MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS=always
      - MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED=true
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - carpinaon-network

volumes:
  pgdata:
    driver: local
  valkey-data:
    driver: local

networks:
  carpinaon-network:
    driver: bridge