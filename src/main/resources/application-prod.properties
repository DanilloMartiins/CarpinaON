# Profile de PRODUÇÃO (Render + Neon)
# As variáveis vêm do dashboard do Render (nunca commitar valores reais)
# Ativar com: SPRING_PROFILES_ACTIVE=prod

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Sem Flyway ainda: o JPA cria/ajusta o schema. Quando tiver migração, vira validate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logs mais limpos em produção
logging.level.root=INFO
logging.level.com.carpinaon=INFO