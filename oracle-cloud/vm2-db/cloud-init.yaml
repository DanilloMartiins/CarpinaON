#cloud-config
# VM2 (DB) - Oracle Cloud Always Free ARM
# PostgreSQL 16 com os tunes do planejamento de carga (Carpina ~80k hab)
# Só recebe conexão da VM1 via rede interna da VCN (porta 5432 fechada pra internet)

package_update: true
package_upgrade: true
packages:
  - docker.io
  - docker-compose-v2
  - git
  - htop
  - vim
  - curl
  - jq
  - postgresql-client-common

write_files:
  # Ajustes de kernel pro PostgreSQL (swappiness baixo, overcommit seguro)
  - path: /etc/sysctl.d/99-postgres-tuning.conf
    content: |
      # Memória: swappiness 10 evita swap prematuro, overcommit 1 deixa o PG alocar
      vm.swappiness = 10
      vm.overcommit_memory = 1
      vm.overcommit_ratio = 80

      # Limite de arquivos: cada conexão gasta file descriptors
      fs.file-max = 1048576

      # Fila de rede maior pro pool de conexões
      net.core.somaxconn = 65535
      net.ipv4.tcp_max_syn_backlog = 65535
      net.ipv4.tcp_fin_timeout = 15
      net.ipv4.tcp_tw_reuse = 1
      net.ipv4.ip_local_port_range = 1024 65535

  - path: /etc/security/limits.d/99-postgres.conf
    content: |
      * soft nofile 65535
      * hard nofile 65535
      * soft nproc 65535
      * hard nproc 65535
      root soft nofile 65535
      root hard nofile 65535

  # Docker Compose do banco (só o PG; o app vive na VM1)
  - path: /opt/carpinaon/docker-compose.yml
    content: |
      services:
        db:
          image: postgres:16-alpine
          container_name: carpinaon-db
          restart: unless-stopped
          environment:
            - POSTGRES_USER=carpinaon
            - POSTGRES_PASSWORD=${DB_PASSWORD}
            - POSTGRES_DB=carpinaon
            # Tunes do planejamento de carga
            - POSTGRES_MAX_CONNECTIONS=300
          ports:
            # Só a rede interna da VCN acessa essa porta
            # (bloqueie na internet pelo security list do Oracle)
            - "5432:5432"
          volumes:
            - pgdata:/var/lib/postgresql/data
            # Roda uma vez na primeira subida: cria o índice parcial da solicitacao
            - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
          healthcheck:
            test: ["CMD-SHELL", "pg_isready -U carpinaon -d carpinaon"]
            interval: 10s
            timeout: 5s
            retries: 5
          deploy:
            resources:
              limits:
                cpus: '3.0'
                memory: 12G
              reservations:
                cpus: '1.5'
                memory: 6G
          logging:
            driver: "json-file"
            options:
              max-size: "10m"
              max-file: "3"
          networks:
            - carpinaon-network

        # Porteiro do banco: várias prefs usam as MESMAS 300 conexões do PG
        # O app da VM1 conecta AQUI (6432), não direto no PG (5432)
        pgbouncer:
          image: edoburu/pgbouncer:latest
          container_name: carpinaon-pgbouncer
          restart: unless-stopped
          depends_on:
            - db
          environment:
            - DB_HOST=db
            - DB_PORT=5432
            - DB_USER=carpinaon
            - DB_PASSWORD=${DB_PASSWORD}
            - DB_NAME=carpinaon
            # transaction = devolve a conexão pro pool assim que a transação termina
            - POOL_MODE=transaction
            - MAX_CLIENT_CONN=500
            - DEFAULT_POOL_SIZE=50
            - MIN_POOL_SIZE=10
            - MAX_DB_CONNECTIONS=200
            - AUTH_TYPE=plain
          ports:
            # App da VM1 conecta no 6432 (o container do pgbouncer escuta 5432)
            - "6432:5432"
          healthcheck:
            test: ["CMD-SHELL", "pgbouncer -h /etc/pgbouncer -q /etc/pgbouncer/pgbouncer.ini"]
            interval: 10s
            timeout: 5s
            retries: 5
          logging:
            driver: "json-file"
            options:
              max-size: "10m"
              max-file: "3"
          networks:
            - carpinaon-network

      volumes:
        pgdata:
          driver: local

      networks:
        carpinaon-network:
          driver: bridge

    owner: ubuntu:ubuntu
    permissions: '0644'

  # Tunes do PostgreSQL aplicados em todo boot
  # (shared_buffers 6GB + work_mem 16MB numa VM de 16GB é o padrão dos guias de tuning ARM)
  - path: /opt/carpinaon/postgres.conf.docker
    content: |
      shared_buffers = 6GB
      effective_cache_size = 12GB
      work_mem = 16MB
      maintenance_work_mem = 1GB

      max_connections = 300
      superuser_reserved_connections = 3

      wal_level = replica
      max_wal_size = 4GB
      min_wal_size = 1GB
      checkpoint_completion_target = 0.9
      wal_buffers = 64MB

      # SSD da Oracle: custo de leitura aleatória baixo
      random_page_cost = 1.1
      effective_io_concurrency = 200

      # Autovacuum mais agressivo: evita bloat nas tabelas de protocolo
      autovacuum_vacuum_scale_factor = 0.05

    owner: ubuntu:ubuntu
    permissions: '0644'

  # Índice parcial: acelera o "minhas solicitações" da tela do cidadão
  # Só roda na primeira inicialização do volume
  - path: /opt/carpinaon/init.sql
    content: |
      CREATE INDEX IF NOT EXISTS idx_solicitacao_usuario_aberta
        ON solicitacao (usuario_id)
        WHERE status IN ('RECEBIDA', 'EM_ANALISE', 'EM_ANDAMENTO');

      CREATE INDEX IF NOT EXISTS idx_solicitacao_protocolo
        ON solicitacao (protocolo);

      CREATE INDEX IF NOT EXISTS idx_servico_categoria
        ON servico (categoria_id) WHERE ativo = true;

    owner: ubuntu:ubuntu
    permissions: '0644'

  # Secrets do banco (preencher antes do primeiro up)
  - path: /opt/carpinaon/.env
    content: |
      # Senha do banco (gerar: openssl rand -base64 32)
      # Use a MESMA senha do .env da VM1
      DB_PASSWORD=trocar_por_senha_forte_aqui

    owner: ubuntu:ubuntu
    permissions: '0600'

runcmd:
  - systemctl enable --now docker
  - sysctl --system
  - usermod -aG docker ubuntu

  - echo 'alias db-logs="docker logs -f --tail=100 carpinaon-db"' >> /home/ubuntu/.bashrc
  - echo 'alias pg-psql="docker exec -it carpinaon-db psql -U carpinaon -d carpinaon"' >> /home/ubuntu/.bashrc
  - echo 'alias pg-metrics="docker exec carpinaon-db pg_stat_statements"' >> /home/ubuntu/.bashrc

  - chown -R ubuntu:ubuntu /opt/carpinaon
  - systemctl restart docker

  - echo "=== VM2 DB Cloud-init concluído em $(date) ===" >> /var/log/carpinaon-init.log

final_message: "VM2 (DB) pronta! Preencha o .env, rode 'docker compose up -d' e libere a porta 6432 (PgBouncer) SÓ pra VM1 no security list."