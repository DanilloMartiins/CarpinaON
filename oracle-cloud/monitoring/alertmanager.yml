route:
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "default"

receivers:
  - name: "default"
    # Webhook genérico: aponta pra onde você quiser (Telegram, Slack, e-mail, etc)
    # Exemplo de payload do Alertmanager v2. Deixe vazio se não quiser notificar ainda.
    webhook_configs:
      - url: ""
